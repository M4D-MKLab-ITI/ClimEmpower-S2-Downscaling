[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climempower-downscaling"
version = "0.1.0"
description = "Sentinel-2 pansharpening/downscaling toolkit (classical + CNN methods)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "rasterio",
    "PyWavelets",
    "matplotlib",
]

[project.optional-dependencies]
pnn = [
    "tensorflow",
    "opencv-python",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["climempower_downscaling*"]
